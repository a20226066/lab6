# Base de datos H2 persistente: no necesitas instalar MySQL para probar el proyecto.
spring.datasource.url=jdbc:h2:file:./data/charlie
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# update crea/actualiza las tablas desde las @Entity sin borrar datos en cada inicio.
spring.jpa.hibernate.ddl-auto=update
# Muestra SQL en consola para que puedas ver INSERT/SELECT y aprender qué hace JPA.
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
